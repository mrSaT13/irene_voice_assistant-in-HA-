# custom_components/irene_voice_assistant/services.yaml

send_command:
  name: Отправить команду Ирине
  description: Отправить текстовую команду Ирине для обработки
  fields:
    entry_id:
      name: Entry ID
      description: ID записи интеграции (опционально, если одна интеграция)
      required: false
      example: "abc123"
      selector:
        text:
    command:
      name: Команда
      description: Текст команды для Ирины
      required: true
      example: "Включи свет в гостиной"
      selector:
        text:

tts_say:
  name: Озвучить через Ирину
  description: Озвучить текст через сервер Ирины
  fields:
    entry_id:
      name: Entry ID
      description: ID записи интеграции (опционально)
      required: false
      selector:
        text:
    text:
      name: Текст
      description: Текст для озвучки
      required: true
      example: "Привет, это тест"
      selector:
        text:

say:
  name: Озвучить с выбором режима
  description: Озвучить текст через Ирину с выбором режима и колонки
  fields:
    entry_id:
      name: Entry ID
      description: ID записи интеграции (опционально)
      required: false
      selector:
        text:
    message:
      name: Сообщение
      description: Текст для озвучки
      required: true
      example: "Привет, это тест"
      selector:
        text:
    mode:
      name: Режим озвучки
      description: Где воспроизводить текст
      required: false
      default: "both"
      example: "both"
      selector:
        select:
          options:
            - value: "irene"
              label: "🎤 Только сервер Ирины"
            - value: "media_player"
              label: "🔊 Только колонка"
            - value: "both"
              label: "🎤🔊 Обе"
    media_player:
      name: Медиаплеер
      description: Медиаплеер для озвучки (переопределяет настройку)
      required: false
      example: "media_player.yandex_station"
      selector:
        entity:
          domain: media_player

control_device:
  name: Управление устройством
  description: Управить устройством через Ирину
  fields:
    entry_id:
      name: Entry ID
      description: ID записи интеграции (опционально)
      required: false
      selector:
        text:
    command:
      name: Команда
      description: Команда для управления устройством
      required: true
      example: "Включи свет в спальне"
      selector:
        text:

get_chat_history:
  name: Получить историю чата
  description: Получить историю сообщений с Ириной
  fields:
    entry_id:
      name: Entry ID
      description: ID записи интеграции (опционально)
      required: false
      selector:
        text:
    limit:
      name: Лимит
      description: Максимальное количество сообщений
      required: false
      default: 50
      example: 50
      selector:
        number:
          min: 1
          max: 1000
          step: 1

clear_chat_history:
  name: Очистить историю чата
  description: Очистить историю сообщений с Ириной
  fields:
    entry_id:
      name: Entry ID
      description: ID записи интеграции (опционально)
      required: false
      selector:
        text:
