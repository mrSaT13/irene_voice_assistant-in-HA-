send_command:
  name: Отправить команду
  description: Отправить текстовую команду Ирине через WebSocket
  fields:
    entry_id:
      name: Entry ID
      description: ID интеграции (опционально)
      required: false
      selector:
        text:
    command:
      name: Команда
      description: Текст команды
      required: true
      example: "включи свет на кухне"
      selector:
        text:

tts_say:
  name: TTS озвучка
  description: Отправить текст для озвучки через Irene
  fields:
    entry_id:
      name: Entry ID
      description: ID интеграции (опционально)
      required: false
      selector:
        text:
    text:
      name: Текст
      description: Текст для озвучки
      required: true
      example: "Привет!"
      selector:
        text:

get_chat_history:
  name: Получить историю чата
  description: Получить историю сообщений
  fields:
    entry_id:
      name: Entry ID
      description: ID интеграции (опционально)
      required: false
      selector:
        text:
    limit:
      name: Лимит
      description: Количество сообщений
      default: 50
      selector:
        number:
          min: 1
          max: 500

clear_chat_history:
  name: Очистить историю
  description: Очистить всю историю чата
  fields:
    entry_id:
      name: Entry ID
      description: ID интеграции (опционально)
      required: false
      selector:
        text:

get_configs:
  name: Получить конфиги
  description: Получить все конфиги Ирины
  fields:
    entry_id:
      name: Entry ID
      description: ID интеграции (опционально)
      required: false
      selector:
        text:

get_plugins:
  name: Получить плагины
  description: Получить список плагинов Ирины
  fields:
    entry_id:
      name: Entry ID
      description: ID интеграции (опционально)
      required: false
      selector:
        text: